<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="810" viewBox="0 0 1260 810" role="img" aria-labelledby="title desc"><title id="title">Waylatch architecture</title><desc id="desc">Field requests cross QR handoff to a coordinator. Local AI informs review. Human approval gates a Sandbox-only backend. SQLite holds financial and audit records. Actual provider execution is pending credentials.</desc><rect width="1260" height="810" fill="#091824"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9bd0c6"/></marker></defs><g font-family="system-ui,sans-serif"><text x="45" y="58" fill="#ffffff" font-size="34">Waylatch</text><text x="45" y="92" fill="#9bd0c6" font-size="19">From field need to verified action / private engineering candidate</text><rect x="45" y="140" width="365" height="135" rx="12" fill="#152a38" stroke="#41616f"/><text x="63" y="175" fill="#fff" font-size="23">Field device</text><text x="63" y="211" fill="#9bd0c6" font-size="15">IndexedDB + service worker</text><text x="63" y="244" fill="#d3dde3" font-size="14">Offline capture / RL1 QR packets</text><rect x="445" y="140" width="365" height="135" rx="12" fill="#152a38" stroke="#41616f"/><text x="463" y="175" fill="#fff" font-size="23">Coordinator</text><text x="463" y="211" fill="#9bd0c6" font-size="15">Explainable local MiniLM review</text><text x="463" y="244" fill="#d3dde3" font-size="14">Explicit human disposition / approval</text><rect x="845" y="140" width="365" height="135" rx="12" fill="#152a38" stroke="#41616f"/><text x="863" y="175" fill="#fff" font-size="23">Sandbox backend</text><text x="863" y="211" fill="#9bd0c6" font-size="15">Express + SQLite reservations</text><text x="863" y="244" fill="#d3dde3" font-size="14">OAuth / Orders v2 / reconciliation</text><rect x="445" y="360" width="365" height="135" rx="12" fill="#152a38" stroke="#41616f"/><text x="463" y="395" fill="#fff" font-size="23">Local AI assets</text><text x="463" y="431" fill="#9bd0c6" font-size="15">Pinned q8 ONNX / CPU</text><text x="463" y="464" fill="#d3dde3" font-size="14">384-dimensional semantic embeddings</text><rect x="845" y="360" width="365" height="135" rx="12" fill="#152a38" stroke="#41616f"/><text x="863" y="395" fill="#fff" font-size="23">Audit history</text><text x="863" y="431" fill="#9bd0c6" font-size="15">Canonical JSON + SHA-256 links</text><text x="863" y="464" fill="#d3dde3" font-size="14">Independent validation / export</text><rect x="845" y="580" width="365" height="135" rx="12" fill="#152a38" stroke="#41616f"/><text x="863" y="615" fill="#fff" font-size="23">PayPal Sandbox</text><text x="863" y="651" fill="#9bd0c6" font-size="15">Buyer approval + authoritative capture</text><text x="863" y="684" fill="#d3dde3" font-size="14">Real execution still blocked by credentials</text><path d="M410 205 L440 205" stroke="#9bd0c6" stroke-width="3" marker-end="url(#arrow)"/><path d="M810 205 L840 205" stroke="#9bd0c6" stroke-width="3" marker-end="url(#arrow)"/><path d="M627 355 L627 280" stroke="#9bd0c6" stroke-width="3" marker-end="url(#arrow)"/><path d="M1027 280 L1027 355" stroke="#9bd0c6" stroke-width="3" marker-end="url(#arrow)"/><path d="M1027 495 L1027 575" stroke="#9bd0c6" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="760" fill="#ecab85" font-size="18">AI informs review. QR imports do not authorize payment. No live payments or automated spending.</text></g></svg>
